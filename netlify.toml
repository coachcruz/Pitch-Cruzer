[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Cross-origin isolation lets the in-browser lyrics model (ONNX Runtime) use several CPU threads.
# Document-Isolation-Policy (Chrome 137+) isolates just this page, so — unlike COOP/COEP — the app can
# still control a song tab it opened (and close it) and embed YouTube's player. Browsers without it
# simply run the fallback lyrics model on one thread.
[[headers]]
  for = "/*"
  [headers.values]
    Document-Isolation-Policy = "isolate-and-credentialless"
