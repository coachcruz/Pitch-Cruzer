name: Deploy Demucs to Modal

on:
  push:
    branches: [main]
    paths:
      - "demucs/**"
      - ".github/workflows/deploy-demucs.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install modal
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          PC_API_KEY: ${{ secrets.PC_API_KEY }}
        run: |
          python -m modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"
          python -m modal secret create pc-demucs PC_API_KEY="$PC_API_KEY" || true
          python -m modal deploy demucs/modal_demucs.py
